name: Publish By SSH

on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  push_to_registry:
    name: Build and Push
    runs-on: ubuntu-latest
    # 用于配置当前workflow的参数
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      # checkout
      - name: Check out the repo
        uses: actions/checkout@v4

      # 在当前操作系统安装node
      # vitepress build
      - name: Build VitePress with Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: |
          npm install
          npm run docs:build

      # 将 master 分支构建产物部署到 1Panel 站点目录
      - name: Deploy to Server Production Path
        if: github.ref == 'refs/heads/master'
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rltzv --delete'
          SOURCE: 'docs/.vitepress/dist/'
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: 'ubuntu'
          TARGET: '/opt/1panel/www/sites/kevinlau.cn/index/'
          EXCLUDE: '/node_modules/'
